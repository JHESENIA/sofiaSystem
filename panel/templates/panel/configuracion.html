{% extends 'panel/base.html' %}
{% load static %}

{% block title %}Configuraciones{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/configuraciones.css' %}">
{% endblock %}

{% block content %}
<div class="container py-4">
    <h3 class="fw-bold mb-4">Configuraciones del Sistema</h3>

    <form class="card shadow-sm p-4 border-0">
        <div class="mb-3">
            <label for="limiteRegistros" class="form-label fw-semibold">Límite de registros</label>
            <input id="limiteRegistros" type="number" class="form-control" placeholder="Ejemplo: 5000">
        </div>

        <div class="mb-3">
            <label for="modoMantenimiento" class="form-label fw-semibold">Modo de mantenimiento</label>
            <select id="modoMantenimiento" class="form-select">
                <option value="desactivado">Desactivado</option>
                <option value="activado">Activado</option>
            </select>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
